<!DOCTYPE HTML>
<html>
<header>
		<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

		<style>
				body {
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
				.box {
					display:block;
					border:1px solid rgba(0, 212, 255, 0.3);
				}

				#mainbox {
					position:static;
					width:100%;
					max-width:900px;
					background-color: rgba(15, 12, 41, 0.6);
					border: 1px solid rgba(0, 212, 255, 0.4);
					padding:20px;
					margin: 0 auto;
					border-radius: 12px;
					box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
				}

				#d0 {
					position:static;
					width:100%;
					max-width:900px;
					background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
					border: 1px solid rgba(0, 212, 255, 0.6);
					padding:20px;
					margin: 0 auto 20px auto;
					border-radius: 12px;
					box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
				}

				#d0 h1 {
					color: #0f0c29;
					text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
					margin: 10px;
				}

				#mainbox h2 {
					color: #00d4ff;
					margin-top: 20px;
				}

				.standard{
					width:100%;
					max-width:800px;
					height:auto;
					min-height:80px;
				}

				.blue{
					background-color:#80d4ff;
				}

				.purple{
					background: rgba(48, 43, 99, 0.4);
					border-radius: 8px;
					padding: 20px;
					margin-bottom: 10px;
					display: flex;
					flex-wrap: wrap;
					align-items: center;
					gap: 10px;
				}

				.purple label {
					color: #e8e8e8;
					min-width: 100px;
				}

				.purple input {
					background-color: rgba(15, 12, 41, 0.8);
					border: 1px solid rgba(0, 212, 255, 0.4);
					color: #e8e8e8;
					padding: 10px;
					border-radius: 4px;
					flex: 1;
					min-width: 150px;
				}

				.purple button {
					background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
					color: #0f0c29;
					border: 1px solid rgba(0, 212, 255, 0.4);
					padding: 10px 20px;
					border-radius: 6px;
					cursor: pointer;
					margin: 5px 5px 5px 0;
					font-weight: 600;
					transition: all 0.3s ease;
					box-shadow: 0 2px 8px rgba(0, 212, 255, 0.3);
				}

				.purple button:hover {
					background: linear-gradient(135deg, #33ddff 0%, #00d4ff 100%);
					transform: translateY(-2px);
					box-shadow: 0 4px 12px rgba(0, 212, 255, 0.5);
				}

				.links-container {
					text-align: center;
					margin-top: 20px;
				}

				.links-container a {
            padding: 12px 24px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: #0f0c29;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
            border: 1px solid rgba(0, 212, 255, 0.4);
            display: inline-block;
        }

        .links-container a:hover {
            background: linear-gradient(135deg, #33ddff 0%, #00d4ff 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 212, 255, 0.5);
        }
		</style>
		
</header>
<body>
	<div id = "d0">
		<h1> Conversion (Celsius to Fahrenheit, Fahrenheit to Celsius, Meters to Feet, Feet to Meters) </h1>
	</div>
<div id="mainbox">
	<h2> Celsius to Fahrenheit </h2>

	<div id = "d1" class="box standard purple">

		<label for ="n1"> Celsius: </label>
		<input id ="n1" name="n1" type="number">

		<button onclick="computeCelsiustoFahrenheit()"> Compute Fahrenheit </button>
		<button onclick="clearvaluesCtF()"> Clear Values </button>
		<br>
		<label for ="fahrenheit" id="Fahrenheit"> Fahrenheit: </label>
		<input id ="fahrenheit" name="fahrenheit" type="number" readonly>

	</div>
	<br>
	
	<h2> Fahrenheit to Celsius </h2>

	<div id = "d2" class="box standard purple">

		<label for ="n2"> Fahrenheit: </label>
		<input id ="n2" name="n2" type="number">

		<button onclick="computeFahrenheittoCelsius()"> Compute Celsius </button>
		<button onclick="clearvaluesFtC()"> Clear Values </button>
		<br>
		<label for ="celsius" id="Celsius"> Celsius: </label>
		<input id ="celsius" name="celsius" type="number" readonly>

	</div>
	<br>
	

	<h2> Meters to Feet </h2>

	<div id = "d3" class="box standard purple">

		<label for ="n3"> Meters: </label>
		<input id ="n3" name="n3" type="number">

		<button onclick="computeMeterstoFeet()"> Compute Feet </button>
		<button onclick="clearvaluesMtFt()"> Clear Values </button>
		<br>
		<label for ="feet" id="Feet"> Feet: </label>
		<input id ="feet" name="feet" type="number" readonly>
		<br>
	</div>
	
	<h2> Feet to Meters </h2>

	<div id = "d3" class="box standard purple">
		<label for ="n4"> Feet: </label>
		<input id ="n4" name="n4" type="number">

		<button onclick="computeFeettoMeters()"> Compute Meters </button>
		<button onclick="clearvaluesFttoM()"> Clear Values </button>
		<br>
		<label for ="meters" id="Meters"> Meters: </label>
		<input id ="meters" name="meters" type="number" readonly>
	<br>
	</div>
	
</div>
<br>
<div class="links-container">
	<a href = "homepage.html"> Back to Home Page </a>
</div>

<script>

// ---------------------------------Computing Functions------------------------------------
function computeCelsiustoFahrenheit()
{
  var c;
  c = document.getElementById("n1").value*1;  
  let f  = (c * 9/5) + 32;
  document.getElementById("Fahrenheit").innerHTML='The Fahrenheit of '+c+'(Celsius) is:';
	document.getElementById("fahrenheit").value=f;

}

function computeFahrenheittoCelsius()
{
  var f;
  f = document.getElementById("n2").value*1;  
  let c  = (f - 32) * 5/9;
  document.getElementById("Celsius").innerHTML='The Celsius of '+f+'(Fahrenheit) is:';
	document.getElementById("celsius").value=c;

}
function computeMeterstoFeet()
{
  var m;
  m = document.getElementById("n3").value*1;  
  let ft  =  m*3.281;
  document.getElementById("Feet").innerHTML='The Feet of '+m+'(Meters) is:';
	document.getElementById("feet").value=ft;

}

function computeFeettoMeters()
{
  var ft;
  ft = document.getElementById("n4").value*1;  
  let m  =  ft/3.281;
  document.getElementById("Meters").innerHTML='The Meters of '+ft+'(Feet) is:';
	document.getElementById("meters").value=m;

}


// ---------------------------Clearing all inputs and outputs------------------------------
function clearvaluesCtF()
{
   document.getElementById("n1").value='';
   document.getElementById("Fahrenheit").innerHTML='Fahrenheit:';
   document.getElementById("fahrenheit").value='';
}

function clearvaluesFtC()
{
   document.getElementById("n2").value='';
   document.getElementById("Celsius").innerHTML='Celsius:';
   document.getElementById("celsius").value='';
}
function clearvaluesMtFt()
{
   document.getElementById("n3").value='';
   document.getElementById("Feet").innerHTML='Feet:';
   document.getElementById("feet").value='';
}
function clearvaluesFttoM()
{
   document.getElementById("n4").value='';
   document.getElementById("Meters").innerHTML='Meters:';
   document.getElementById("meters").value='';
}

	
</script>


</body>

</html>
