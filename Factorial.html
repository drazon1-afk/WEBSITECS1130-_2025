<!DOCTYPE html>
<html>
<head>
	<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
		<style>
				body {
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
				.box {
					display:block;
					border:1px solid rgba(0, 212, 255, 0.3);
				}
				#mainbox {
					position:static;
					width:100%;
					max-width:900px;
					background-color: rgba(15, 12, 41, 0.6);
					border: 1px solid rgba(0, 212, 255, 0.4);
					padding:20px;
					margin: 0 auto;
					border-radius: 12px;
					box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
				}
				#d0 {
					position:static;
					width:100%;
					max-width:900px;
					background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
					border: 1px solid rgba(0, 212, 255, 0.6);
					padding:20px;
					margin: 0 auto 20px auto;
					border-radius: 12px;
					box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
				}
				#d0 h1 {
					color: #0f0c29;
					text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
					margin: 10px;
				}
				#mainbox h2 {
					color: #00d4ff;
					margin-top: 20px;
				}
				.standard{
					width:100%;
					max-width:800px;
					height:auto;
					min-height:80px;
				}
				.blue{
					background-color:#80d4ff;
				}
				.purple{
					background: rgba(48, 43, 99, 0.4);
					border-radius: 8px;
					padding: 20px;
					margin-bottom: 10px;
					display: flex;
					flex-wrap: wrap;
					align-items: center;
					gap: 10px;
				}
				.purple label {
					color: #e8e8e8;
					min-width: 120px;
				}
				.purple input {
					background-color: rgba(15, 12, 41, 0.8);
					border: 1px solid rgba(0, 212, 255, 0.4);
					color: #e8e8e8;
					padding: 10px;
					border-radius: 4px;
					flex: 1;
					min-width: 150px;
				}
				.purple button {
					background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
					color: #0f0c29;
					border: 1px solid rgba(0, 212, 255, 0.4);
					padding: 10px 20px;
					border-radius: 6px;
					cursor: pointer;
					margin: 5px 5px 5px 0;
					font-weight: 600;
					transition: all 0.3s ease;
					box-shadow: 0 2px 8px rgba(0, 212, 255, 0.3);
				}
				.purple button:hover {
					background: linear-gradient(135deg, #33ddff 0%, #00d4ff 100%);
					transform: translateY(-2px);
					box-shadow: 0 4px 12px rgba(0, 212, 255, 0.5);
				}
				.links-container {
					text-align: center;
					margin-top: 20px;
				}
				.links-container a {
            		padding: 12px 24px;
            		background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            		color: #0f0c29;
            		text-decoration: none;
            		border-radius: 8px;
					font-weight: 700;
					transition: all 0.3s ease;
					box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
					border: 1px solid rgba(0, 212, 255, 0.4);
					display: inline-block;
        		}
				.links-container a:hover {
					background: linear-gradient(135deg, #33ddff 0%, #00d4ff 100%);
					transform: translateY(-2px);
					box-shadow: 0 6px 16px rgba(0, 212, 255, 0.5);
				}
		</style>
</head>
<body>
	<div id = "d0">
		<h1> Factorial (While Loop), Sum (Do While Loop) and Average (For Loop) of First N Natural Numbers </h1>
	</div>
<div id="mainbox">
	<h2> Factorial (While Loop) </h2>
	<div id = "d1" class="box standard purple">
		<label for ="n1"> Enter a number: </label>
		<input id ="n1" name="n1" type="number">
		<button onclick="computeFactorial()"> Compute Factorial </button>
		<br>
		<label for ="factorial" id="Factorial"> Factorial: </label>
		<input id ="factorial" name="factorial" type="number" readonly>
	</div>
	<h2> Sum (Do While Loop) </h2>
	<div id = "d2" class="box standard purple">
		<label for ="n2"> Enter a number: </label>
		<input id ="n2" name="n2" type="number">
		<button onclick="computeSum()"> Compute Sum </button>
		<br>
		<label for ="sum" id="Sum"> Sum: </label>
		<input id ="sum" name="sum" type="number" readonly>
	</div>
	<h2> Average (For Loop) of First N Natural Numbers </h2>
	<div id = "d3" class="box standard purple">
		<label for ="n3"> Enter a number: </label>
		<input id ="n3" name="n3" type="number">
		<button onclick="computeAverage()"> Compute Average </button>
		<br>
		<label for ="average" id="Average"> Average: </label>
		<input id ="average" name="average" type="number" readonly>
	</div>
</div>
<br>
	<div class="links-container">
        <a href = "homepage.html"> Back to Home Page </a>
    </div>
	<script>
		function computeFactorial()
		{
  			
  			let i = document.getElementById("n1").value*1;
  			let result = 1;
  			while (i > 1) {
  				result = result * i;
  				i--;
  			}
			document.getElementById("factorial").value=result;
		}
		function computeSum()
		{
			let j = document.getElementById("n2").value*1;
  			let result = 0;
  			let a = 1;
  			do{
  				result = result + a;
  				a++;
  			} 
  			while (a <= j)
  			document.getElementById("sum").value=result;
		}
		function computeAverage() 
		{
			let k = document.getElementById("n3").value*1;
  			let result = 0;
  			for (let b = 0; b <= k; b++){
  				result = result + b;
  			}
  			let aver = result/k;
  			
  			document.getElementById("average").value=aver;
		}
	</script>
</body>
</html>
