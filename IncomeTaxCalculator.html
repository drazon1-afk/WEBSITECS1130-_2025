<!DOCTYPE HTML>
<html>
<head>
	<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
	<style>
		body {
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
		#d0 {
			position:static;
			width:100%;
			max-width:600px;
			background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
			border: 1px solid rgba(0, 212, 255, 0.6);
			padding:20px;
			margin: 0 auto 30px auto;
			border-radius: 12px;
			box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
		}
		#d0 h1 {
			color: #0f0c29;
			text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
			margin: 10px;
			text-align: center;
		}
		.box {
			display:block;
			border:1px solid rgba(0, 212, 255, 0.3);
		}
		.standard {
			width:100%;
			max-width:800px;
			height:auto;
			min-height:100px;
			margin: 0 auto;
		}
		.purple{
			background-color:#b3b3ff;
		}
		.blue{
			background: rgba(48, 43, 99, 0.4);
			border-radius: 8px;
			padding: 25px;
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: 10px;
		}
		.blue label {
			color: #e8e8e8;
			min-width: 150px;
			font-weight: 600;
		}
		.blue input {
			background-color: rgba(15, 12, 41, 0.8);
			border: 1px solid rgba(0, 212, 255, 0.4);
			color: #e8e8e8;
			padding: 12px;
			border-radius: 4px;
			flex: 1;
			min-width: 200px;
			font-size: 1em;
		}
		.blue button {
			background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
			color: #0f0c29;
			border: 1px solid rgba(0, 212, 255, 0.4);
			padding: 12px 24px;
			border-radius: 6px;
			cursor: pointer;
			margin: 5px 5px 5px 0;
			font-weight: 600;
			transition: all 0.3s ease;
			box-shadow: 0 2px 8px rgba(0, 212, 255, 0.3);
		}
		.blue button:hover {
			background: linear-gradient(135deg, #33ddff 0%, #00d4ff 100%);
			transform: translateY(-2px);
			box-shadow: 0 4px 12px rgba(0, 212, 255, 0.5);
		}
		.links-container {
			text-align: center;
			margin-top: 30px;
		}
		.links-container a {
            padding: 12px 24px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: #0f0c29;
            text-decoration: none;
            border-radius: 8px;
			font-weight: 700;
			transition: all 0.3s ease;
			box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
			border: 1px solid rgba(0, 212, 255, 0.4);
			display: inline-block;
        }
		.links-container a:hover {
			background: linear-gradient(135deg, #33ddff 0%, #00d4ff 100%);
			transform: translateY(-2px);
			box-shadow: 0 6px 16px rgba(0, 212, 255, 0.5);
		}
	</style>
</head>
<body>
	<div id = "d0">
		<h1> Income Tax Calculator </h1>
	</div>

<div id = "d1" class="box standard blue">
	<label for ="it"> Input Taxable Income: </label>
	<input id ="it" name="it" type="number">
	<button onclick="computeIncomeTax()"> Compute Income Tax </button>
	<button onclick="clearvaluesIncometax()"> Clear Values </button>
	<br>
	<label for ="iT" id="IT"> Income Tax: </label>
	<input id ="iT" name="iT" type="number" readonly>
</div>
<br>
<div class="links-container">
	<a href = "homepage.html"> Back to Home Page </a>
</div>
<script>
	
function computeIncomeTax()
{
  var tax_income, rate, income_tax;
  tax_income = document.getElementById("it").value*1;
    if (tax_income > 8000000) {
        rate = (tax_income - 8000000) * 0.35;
        income_tax = 2410000 + rate;
    } else if (tax_income > 2000000) {
        rate = (tax_income - 2000000) * 0.32;
        income_tax = 490000 + rate;
    } else if (tax_income > 800000) {
        rate = (tax_income - 800000) * 0.30;
        income_tax = 130000 + rate;
    } else if (tax_income > 400000) {
        rate = (tax_income - 400000) * 0.25;
        income_tax = 30000 + rate;
    } else if (tax_income > 250000) {
        rate = (tax_income - 250000) * 0.20;
        income_tax = rate;
        
    } else { 
        income_tax = 0;
    }
  document.getElementById("IT").innerHTML='Income Tax is:';
  document.getElementById("iT").value = income_tax.toFixed(2);
}
function clearvaluesIncometax()
{
   document.getElementById("it").value='';
   document.getElementById("IT").innerHTML='Income Tax is:';
   document.getElementById("iT").value='';
}
</script>
</body>
</html>
